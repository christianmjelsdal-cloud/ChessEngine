name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBATCH_MODE=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Run Perft Tests
        run: ./build/test_exe
      - name: Run Smoke Tests
        run: ./build/smoketest_exe

  build-linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: CC=clang CXX=clang++ cmake -B build -DCMAKE_BUILD_TYPE=Release -DBATCH_MODE=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Run Perft Tests
        run: ./build/test_exe
      - name: Run Smoke Tests
        run: ./build/smoketest_exe

  build-windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DBATCH_MODE=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Run Perft Tests
        run: .\build\Release\test_exe.exe
      - name: Run Smoke Tests
        run: .\build\Release\smoketest_exe.exe

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with TSan
        run: CC=clang CXX=clang++ cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=ON -DBATCH_MODE=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Run Perft Tests (TSan)
        run: ./build/test_exe
      - name: Run Smoke Tests (TSan)
        run: ./build/smoketest_exe

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run Pipeline Tests
        run: python test_pipeline.py
